# Render blueprint - free web service serving the API and the built React app.
#
# The database is NOT defined here on purpose: Render's own free Postgres
# expires 30 days after creation. Use an external Neon free database instead
# (permanent, no card) and paste its pooled connection string into DATABASE_URL.
services:
  - type: web
    name: elite-timesheet
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      # Vite needs headroom on a 512 MB free instance build.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      # Set these in the Render dashboard (marked sync: false = not in git):
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: JWT_SECRET            # openssl rand -hex 32
        sync: false
      - key: ENCRYPTION_KEY        # openssl rand -hex 32
        sync: false
      - key: REQUIRE_SESSION_ID
        value: "true"
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_ORG
        value: "true"
      - key: DEMO_ORG_NAME
        value: Monash Demo Clinic
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
