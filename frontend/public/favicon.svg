<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sh-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="32" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Base Squircle Container -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#sh-grad)"/>
  
  <!-- Clock Circle Face -->
  <circle cx="16" cy="16" r="8.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Clock Hands (10:10 dynamic poise) -->
  <path d="M16 16L12.5 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 16L20.5 13.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Precision Center Pivot -->
  <circle cx="16" cy="16" r="1.2" fill="#FFFFFF"/>
  
  <!-- Active Live Tracking Indicator Dot -->
  <circle cx="23.5" cy="8.5" r="2.2" fill="#10B981" stroke="#FFFFFF" stroke-width="1"/>
</svg>